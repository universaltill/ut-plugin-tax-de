name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go vet
        # Cross-compiled to match scripts/build.sh's actual GOOS/GOARCH: this
        # plugin's entry point is behind a `//go:build wasip1` tag, so host
        # `go vet ./...` silently skips it entirely (ut-docs#166 review).
        run: GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$fmt_out" >&2
            exit 1
          fi
      - name: Test (host-buildable packages only — src/main.go is wasip1-only)
        run: go test ./...
      - name: Build WASI module
        run: scripts/build.sh
      - name: Validate manifest + plugin manifest
        run: scripts/validate.sh
      - name: Guard plugin i18n (locale key drift)
        run: scripts/guard-plugin-i18n.sh
      - name: Package (dry run)
        run: scripts/package.sh
  version-bump:
    # PR-only: this compares the PR's base/head, which push/schedule/
    # workflow_dispatch events don't carry a meaningful pair for.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the PR base, not just a shallow tip.
          fetch-depth: 0
      - name: Version-bump guard self-tests
        if: always()
        run: scripts/check-version-bump.test.sh
      - name: Require a manifest.json version bump on shipped-file changes (ut-docs#1940, ut-docs#1948)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-version-bump.sh
